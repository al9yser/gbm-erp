name: Android Native CI
on:
  push:
    branches: [main, android-native]
    paths: ["android/**", ".github/workflows/android-native.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android-native.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-35;google_apis;x86_64"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile, unit test and assemble
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Run Android Emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: cd android && gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gbm-erp-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
